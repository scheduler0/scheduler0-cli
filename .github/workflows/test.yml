name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.23'
          - os: ubuntu-latest
            go-version: '1.24'
          - os: macos-latest
            go-version: '1.23'
          - os: windows-latest
            go-version: '1.23'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: go.sum
    
    - name: Use latest scheduler0-go-client
      run: |
        go mod edit -dropreplace github.com/scheduler0/scheduler0-go-client
        go get github.com/scheduler0/scheduler0-go-client@latest
        go mod tidy

    - name: Download dependencies
      run: go mod download
    
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-cli
        fail_ci_if_error: false

